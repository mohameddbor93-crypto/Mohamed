<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
    font-family: Arial, sans-serif;
    color: white;
    padding: 20px;
}

.card {
    width: min(430px, 100%);
    background: #1c1c1c;
    border-radius: 24px;
    padding: 16px;
    text-align: center;
    box-shadow: 0 10px 40px #0008;
}

img {
    width: 100%;
    border-radius: 18px;
    display: block;
}

h2 {
    margin: 16px 0 8px;
}

p {
    color: #bbb;
    margin: 0 0 14px;
}

.song {
    display: block;
    text-decoration: none;
    background: white;
    color: #111;
    padding: 14px;
    border-radius: 14px;
    font-weight: bold;
    margin-bottom: 16px;
}

#qr {
    background: white;
    padding: 12px;
    border-radius: 14px;
    display: inline-block;
}

.small {
    font-size: 12px;
    color: #888;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="card">

    <img src="photo.jpg" alt="Photo">

    <h2>❤️</h2>

    <p>أغنيتنا 🎵</p>

    <a
      class="song"
      href="https://open.spotify.com/track/2QivAUOWFDjAddYG7eIzwL"
      target="_blank">
      ▶️ افتح الأغنية على Spotify
    </a>

    <div id="qr"></div>

    <div class="small">
        امسح الـ QR لفتح الصورة والأغنية
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<script>
new QRCode(document.getElementById("qr"), {
    text: window.location.href,
    width: 190,
    height: 190
});
</script>

</body>
</html>
